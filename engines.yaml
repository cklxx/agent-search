# Engine configurations for agent-search
# Migrated from SearXNG engine definitions.
#
# Two types:
#   html: CSS selector-based scraping
#   json: JSON API field mapping
#
# URL placeholders: {query}, {pageno}, {lang}, {time_range}, {safe_search}

# --- JSON API engines ---

- name: wikipedia
  type: json
  categories: [general, wikimedia]
  search_url: "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch={query}&srlimit=10&format=json"
  json:
    results: "query/search"
    url: "title"
    url_prefix: "https://en.wikipedia.org/wiki/"
    title: "title"
    content: "snippet"

- name: github
  type: json
  categories: [general, repos]
  search_url: "https://api.github.com/search/repositories?q={query}&per_page=10"
  json:
    results: "items"
    url: "html_url"
    title: "full_name"
    content: "description"

- name: hackernews
  type: json
  categories: [general, news]
  search_url: "https://hn.algolia.com/api/v1/search?query={query}&tags=story"
  json:
    results: "hits"
    url: "url"
    title: "title"
    content: "story_text"

- name: arxiv
  type: json
  categories: [science, scientific publications]
  search_url: "http://export.arxiv.org/api/query?search_query=all:{query}&max_results=10"
  # Note: arxiv returns Atom XML, not JSON. This is a placeholder.
  json:
    results: "feed/entry"
    url: "id"
    title: "title"
    content: "summary"

- name: npm
  type: json
  categories: [packages, it]
  search_url: "https://registry.npmjs.org/-/v1/search?text={query}&size=10"
  json:
    results: "objects"
    url: "package/links/npm"
    title: "package/name"
    content: "package/description"

- name: crates
  type: json
  categories: [packages, cargo]
  search_url: "https://crates.io/api/v1/crates?q={query}&per_page=10"
  json:
    results: "crates"
    url: "id"
    url_prefix: "https://crates.io/crates/"
    title: "name"
    content: "description"

- name: pypi
  type: html
  categories: [packages]
  search_url: "https://pypi.org/search/?q={query}"
  html:
    results: ".package-snippet"
    url: "a.package-snippet__name"
    title: "span.package-snippet__name"
    content: "p.package-snippet__description"

- name: stackoverflow
  type: html
  categories: [it, q&a]
  search_url: "https://stackoverflow.com/search?q={query}"
  html:
    results: ".question-summary"
    url: "a.question-hyperlink"
    title: "a.question-hyperlink"
    content: ".excerpt"

- name: reddit
  type: json
  categories: [general, social media]
  search_url: "https://www.reddit.com/search.json?q={query}&limit=10"
  json:
    results: "data/children"
    url: "data/url"
    title: "data/title"
    content: "data/selftext"

- name: mdn
  type: json
  categories: [it, software wikis]
  search_url: "https://developer.mozilla.org/api/v1/search?q={query}&page={pageno}"
  paging: true
  json:
    results: "documents"
    url: "mdn_url"
    url_prefix: "https://developer.mozilla.org"
    title: "title"
    content: "summary"

- name: duckduckgo
  type: html
  categories: [general]
  search_url: "https://html.duckduckgo.com/html/?q={query}"
  method: POST
  request_body: "q={query}"
  html:
    results: ".result"
    url: ".result__title a"
    title: ".result__title a"
    content: ".result__snippet"

- name: bing
  type: html
  categories: [general, web]
  search_url: "https://www.bing.com/search?q={query}&first={pageno}"
  paging: true
  page_size: 10
  first_page_num: 1
  html:
    results: ".b_algo"
    url: "h2 a"
    title: "h2 a"
    content: ".b_caption p"

- name: brave
  type: html
  categories: [general, web]
  search_url: "https://search.brave.com/search?q={query}&offset={pageno}"
  paging: true
  page_size: 10
  first_page_num: 0
  html:
    results: ".snippet"
    url: ".snippet-url a"
    title: ".snippet-title"
    content: ".snippet-description"

- name: startpage
  type: html
  categories: [general, web]
  search_url: "https://www.startpage.com/do/search?query={query}"
  html:
    results: ".w-gl__result"
    url: "a.w-gl__result-title"
    title: "a.w-gl__result-title"
    content: "p.w-gl__description"

- name: qwant
  type: json
  categories: [general, web]
  search_url: "https://api.qwant.com/v3/search/web?q={query}&count=10"
  json:
    results: "data/result/items/mainline"
    url: "url"
    title: "title"
    content: "desc"

- name: mojeek
  type: html
  categories: [general, web]
  search_url: "https://www.mojeek.com/search?q={query}"
  html:
    results: ".result"
    url: "a.ob"
    title: "a.ob"
    content: "p.s"

- name: wikipedia_zh
  type: json
  categories: [general, wikimedia]
  search_url: "https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch={query}&srlimit=10&format=json"
  json:
    results: "query/search"
    url: "title"
    url_prefix: "https://zh.wikipedia.org/wiki/"
    title: "title"
    content: "snippet"

- name: baidu
  type: html
  categories: [general, web]
  search_url: "https://www.baidu.com/s?wd={query}&pn={pageno}"
  paging: true
  page_size: 10
  first_page_num: 0
  html:
    results: ".result"
    url: "h3 a"
    title: "h3 a"
    content: ".c-abstract"

- name: sogou
  type: html
  categories: [general, web]
  search_url: "https://www.sogou.com/web?query={query}"
  html:
    results: ".vrwrap"
    url: "h3 a"
    title: "h3 a"
    content: ".space-txt"

- name: bilibili
  type: json
  categories: [videos, social media]
  search_url: "https://api.bilibili.com/x/web-interface/search/all/v2?keyword={query}"
  json:
    results: "data/result"
    url: "arcurl"
    title: "title"
    content: "description"

