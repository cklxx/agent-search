# AB evaluation query set — technical & academic focus
#
# Each query has expected keywords/domains for relevance scoring.
# Used to compare ranking strategies (BM25 weights, engine weights, etc.).

queries:
  # --- Programming Languages ---
  - query: "rust async runtime tokio"
    category: programming
    expected_keywords: ["tokio", "async", "runtime", "future", "await"]
    expected_domains: ["tokio.rs", "rust-lang.org", "docs.rs"]

  - query: "python decorator metaclass"
    category: programming
    expected_keywords: ["decorator", "metaclass", "python", "wrapper"]
    expected_domains: ["python.org", "realpython.com", "stackoverflow.com"]

  - query: "go goroutine channel concurrency"
    category: programming
    expected_keywords: ["goroutine", "channel", "concurrency", "go"]
    expected_domains: ["go.dev", "golang.org", "stackoverflow.com"]

  - query: "rust borrow checker lifetime"
