name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Pre-download model
        run: |
          ./target/release/agent-search &
          SERVER_PID=$!
          sleep 30
          # Trigger model download via a search request
          curl -s -X POST http://127.0.0.1:18789/search \
            -H "Content-Type: application/json" \
            -d '{"query":"test","max_results":1}' || true
          sleep 10
          kill $SERVER_PID 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/agent-search dist/
          cp config.toml dist/
          cp engines.yaml dist/
          # Bundle the downloaded model
          cp -r models dist/models
          cat > dist/start.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./agent-search
          EOF
          chmod +x dist/start.sh
          tar -czf agent-search-macos-arm64.tar.gz -C dist .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-search-macos-arm64.tar.gz
